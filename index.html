<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // Intercept Vite HMR WebSocket in Cloud Run iframe/proxy environment where HMR port is closed
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function (url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes('24678')))) {
              var stub = new EventTarget();
              stub.readyState = 1; // WebSocket.OPEN
              stub.OPEN = 1;
              stub.CLOSED = 3;
              stub.CLOSING = 2;
              stub.CONNECTING = 0;
              stub.send = function () {};
              stub.close = function () {};
              setTimeout(function () {
                stub.dispatchEvent(new Event('open'));
              }, 0);
              return stub;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CONNECTING = 0;
        }

        // Suppress [vite] console error output in preview
        var origConsoleError = console.error;
        console.error = function () {
          var first = arguments[0];
          if (typeof first === 'string' && (first.includes('[vite]') || first.includes('WebSocket'))) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function (e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite') || msg.includes('ws://') || msg.includes('wss://'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = (e && e.reason && (e.reason.message || e.reason)) || '';
          if (typeof reason === 'string' && (reason.includes('WebSocket') || reason.includes('websocket') || reason.includes('vite'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <title>MyDay Hub</title>
